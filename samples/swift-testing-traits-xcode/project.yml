name: TraitsXcode
options:
  bundleIdPrefix: dev.example.traitsxcode
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  TraitsXcode:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  TraitsXcodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TraitsXcode
  TraitsXcodeUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnitTests]
    dependencies:
      - target: TraitsXcode
schemes:
  TraitsXcode:
    build:
      targets:
        TraitsXcode: all
    test:
      targets: [TraitsXcodeUITests, TraitsXcodeUnitTests]
