name: HingeLab
options:
  bundleIdPrefix: dev.example.hingelab
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  HingeLab:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  HingeLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HingeLab
  HingeLabSwiftTestingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SwiftTestingUITests]
    dependencies:
      - target: HingeLab
schemes:
  HingeLab:
    build:
      targets:
        HingeLab: all
    test:
      targets: [HingeLabUITests, HingeLabSwiftTestingUITests]
