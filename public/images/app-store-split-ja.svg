<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">App Store に出すまでの分担</title><rect width="760" height="420" rx="20" fill="#f0f5f7"/><g font-family="sans-serif" fill="#243b49"><text x="36" y="48" font-size="22" font-weight="600">App Store に出すまでの分担</text><rect x="36" y="72" width="336" height="282" rx="12" fill="#dff0ee" stroke="#cbdbe2"/><text x="56" y="106" font-size="19" font-weight="600" fill="#087e8b">Claude Code</text><circle cx="62" cy="140" r="4" fill="#577381"/><text x="76" y="146" font-size="16">App Store Connect の入力</text><circle cx="62" cy="184" r="4" fill="#577381"/><text x="76" y="190" font-size="16">スクリーンショットの撮影と追加</text><circle cx="62" cy="228" r="4" fill="#577381"/><text x="76" y="234" font-size="16">ビルドの archive とアップロード</text><circle cx="62" cy="272" r="4" fill="#577381"/><text x="76" y="278" font-size="16">審査メモとビルドの選択</text><circle cx="62" cy="316" r="4" fill="#577381"/><text x="76" y="322" font-size="16">App のプライバシーの回答 (案)</text><rect x="388" y="72" width="336" height="282" rx="12" fill="white" stroke="#cbdbe2"/><text x="408" y="106" font-size="19" font-weight="600" fill="#243b49">人</text><circle cx="414" cy="140" r="4" fill="#577381"/><text x="428" y="146" font-size="16">ログイン</text><circle cx="414" cy="184" r="4" fill="#577381"/><text x="428" y="190" font-size="16">利用規約への同意</text><circle cx="414" cy="228" r="4" fill="#577381"/><text x="428" y="234" font-size="16">連絡先・DSA の申告</text><circle cx="414" cy="272" r="4" fill="#577381"/><text x="428" y="278" font-size="16">「審査に出す」のボタン</text><circle cx="414" cy="316" r="4" fill="#577381"/><text x="428" y="322" font-size="16">TestFlight での実機の確認</text><text x="36" y="388" font-size="14" fill="#577381">決めること (文言・価格・配信国・プライバシーの回答) は人が選び、Claude Code が入力する</text></g></svg>