<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" role="img" aria-labelledby="title desc"><title id="title">More tests on the main actor, later values</title><desc id="desc">Delay when waiting on an AsyncStream for a value sent after 300 ms. With only the consumer on main, 0, 2, 4, and 8 busy @MainActor tests running at the same time gave delays of about 0, 100 ms, 200 ms, and 400 ms. With the producer also on main, the delays were about 0, 200 to 300 ms, and 500 to 600 ms, and with 8 busy tests 2 of 5 waits hit the custom 1 second timeout. Each busy test uses main for 50 ms and then yields. With 8 busy tests, the 400 ms delay matches the consumer waiting behind all 8, 8 times 50 ms. Off main, the delay stayed under 20 ms even with 8 busy tests.</desc><rect width="880" height="700" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32.0" y="46.0" font-size="24" fill="#243b49" text-anchor="start" font-weight="650">More tests on the main actor, later values</text><text x="32.0" y="76.0" font-size="16" fill="#577381" text-anchor="start">Waiting on an AsyncStream for a value sent after 300 ms: how many ms late it arrived (typical of 3 runs)</text><rect x="32" y="96" width="816" height="400" rx="12" fill="white" stroke="#cbdbe2"/><text x="52.0" y="126.0" font-size="18" fill="#243b49" text-anchor="start" font-weight="600">Busy @MainActor tests running at the same time, and the delay</text><rect x="52.0" y="140.0" width="20.0" height="16" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="80.0" y="153.0" font-size="14" fill="#577381" text-anchor="start">Only the consumer on main</text><rect x="340.0" y="140.0" width="20.0" height="16" rx="6" fill="#087e8b" stroke="#087e8b"/><text x="368.0" y="153.0" font-size="14" fill="#577381" text-anchor="start">Consumer and producer on main</text><text x="234.0" y="212.0" font-size="15" fill="#243b49" text-anchor="end">0 busy tests</text><rect x="250.0" y="178.0" width="3.0" height="22" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="263.0" y="195.0" font-size="13" fill="#577381" text-anchor="start">about 0</text><rect x="250.0" y="206.0" width="3.0" height="22" rx="6" fill="#087e8b" stroke="#087e8b"/><text x="263.0" y="223.0" font-size="13" fill="#577381" text-anchor="start">about 0</text><text x="234.0" y="282.0" font-size="15" fill="#243b49" text-anchor="end">2 busy tests</text><rect x="250.0" y="248.0" width="54.0" height="22" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="314.0" y="265.0" font-size="13" fill="#577381" text-anchor="start">100ms</text><rect x="250.0" y="276.0" width="162.0" height="22" rx="6" fill="#087e8b" stroke="#087e8b"/><text x="422.0" y="293.0" font-size="13" fill="#577381" text-anchor="start">200–300ms</text><text x="234.0" y="352.0" font-size="15" fill="#243b49" text-anchor="end">4 busy tests</text><rect x="250.0" y="318.0" width="108.0" height="22" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="368.0" y="335.0" font-size="13" fill="#577381" text-anchor="start">200ms</text><rect x="250.0" y="346.0" width="324.0" height="22" rx="6" fill="#087e8b" stroke="#087e8b"/><text x="584.0" y="363.0" font-size="13" fill="#577381" text-anchor="start">500–600ms</text><text x="234.0" y="422.0" font-size="15" fill="#243b49" text-anchor="end">8 busy tests</text><rect x="250.0" y="388.0" width="216.0" height="22" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="476.0" y="405.0" font-size="13" fill="#577381" text-anchor="start">400ms</text><rect x="250.0" y="416" width="540.0" height="22" rx="6" fill="white" stroke="#087e8b" stroke-dasharray="5 4"/><text x="260.0" y="433.0" font-size="13" fill="#087e8b" text-anchor="start" font-weight="600">2 of 5 hit the 1 s timeout</text><line x1="250.0" y1="170" x2="250.0" y2="458" stroke="#cbdbe2" stroke-width="1.5"/><text x="250.0" y="476.0" font-size="13" fill="#577381" text-anchor="middle">0ms</text><line x1="385.0" y1="170" x2="385.0" y2="458" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="385.0" y="476.0" font-size="13" fill="#577381" text-anchor="middle">250ms</text><line x1="520.0" y1="170" x2="520.0" y2="458" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="520.0" y="476.0" font-size="13" fill="#577381" text-anchor="middle">500ms</text><line x1="655.0" y1="170" x2="655.0" y2="458" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="655.0" y="476.0" font-size="13" fill="#577381" text-anchor="middle">750ms</text><line x1="790.0" y1="170" x2="790.0" y2="458" stroke="#087e8b" stroke-width="1.5"/><text x="790.0" y="476.0" font-size="13" fill="#577381" text-anchor="middle">1000ms</text><text x="784.0" y="166.0" font-size="13" fill="#087e8b" text-anchor="end">Custom 1 s timeout</text><rect x="32" y="516" width="816" height="160" rx="12" fill="white" stroke="#cbdbe2"/><text x="52.0" y="546.0" font-size="18" fill="#243b49" text-anchor="start" font-weight="600">How the delay adds up (8 busy tests)</text><text x="116.0" y="590.0" font-size="15" fill="#243b49" text-anchor="end" font-weight="600">main</text><rect x="131.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="165.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">busy1</text><rect x="201.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="235.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">busy2</text><rect x="271.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="305.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">busy3</text><rect x="341.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="375.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">busy4</text><rect x="411.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="445.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">busy5</text><rect x="481.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="515.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">busy6</text><rect x="551.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="585.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">busy7</text><rect x="621.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="655.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">busy8</text><rect x="691.0" y="570.0" width="69.0" height="30" rx="6" fill="#087e8b" stroke="#087e8b"/><text x="725.0" y="590.0" font-size="12" fill="white" text-anchor="middle" font-weight="600">wait</text><text x="130.0" y="628.0" font-size="14" fill="#577381" text-anchor="start">Each busy test uses main for 50 ms and then yields. The 400 ms delay matches the consumer</text><text x="130.0" y="652.0" font-size="14" fill="#577381" text-anchor="start">waiting behind all 8: 8 × 50 ms. Off main, it stayed under 20 ms even with 8 busy tests.</text></g></svg>
