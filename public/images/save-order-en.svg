<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" role="img" aria-labelledby="title desc"><title id="title">An old autosave arrives after a newer save</title><desc id="desc">Autosave B waits while the final save writes A. Without tickets, old B overwrites A. With tickets, the stale request is superseded and disk remains A.</desc><rect width="880" height="650" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32" y="46" font-size="25" font-weight="650">An old autosave arrives after a newer save</text><text x="32" y="78" font-size="17" fill="#577381">Disk and screen hold A. The pending edit B has not been written.</text><rect x="48" y="110" width="784" height="60" rx="10" fill="white" stroke="#cbdbe2"/><text x="72" y="147" font-size="20">1. Autosave captures B and waits to write</text><path d="M440 170 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#577381" stroke-width="2"/><rect x="48" y="196" width="784" height="60" rx="10" fill="white" stroke="#cbdbe2"/><text x="72" y="233" font-size="20">2. User undoes to A → final save writes A</text><path d="M440 256 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#577381" stroke-width="2"/><rect x="48" y="282" width="784" height="60" rx="10" fill="white" stroke="#cbdbe2"/><text x="72" y="319" font-size="20">3. The old request for B reaches the write check</text><rect x="48" y="384" width="380" height="190" rx="12" fill="white" stroke="#cbdbe2"/><text x="238" y="419" text-anchor="middle" font-size="21" font-weight="650">Without tickets</text><text x="238" y="459" text-anchor="middle" font-size="18" >Disk is A → comparison passes</text><text x="238" y="499" text-anchor="middle" font-size="18" >Old B is written</text><text x="238" y="539" text-anchor="middle" font-size="18" font-weight="650">Screen A / Disk B</text><rect x="452" y="384" width="380" height="190" rx="12" fill="#dff0ee" stroke="#087e8b"/><text x="642" y="419" text-anchor="middle" font-size="21" font-weight="650">With tickets</text><text x="642" y="459" text-anchor="middle" font-size="18" >Old request #1 &lt; claimed #2</text><text x="642" y="499" text-anchor="middle" font-size="18" >Do not write B (superseded)</text><text x="642" y="539" text-anchor="middle" font-size="18" font-weight="650">Screen A / Disk A</text><path d="M440 342 V364 H238 V380 M440 364 H642 V380" stroke="#577381" stroke-width="2" fill="none"/><text x="440" y="616" text-anchor="middle" font-size="17" fill="#577381">Tickets order writes within this process. External editors require a separate check.</text></g></svg>
