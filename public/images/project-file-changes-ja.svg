<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="title desc"><title id="title">ファイルを 1 本足すと、プロジェクトファイルのどこが変わるか</title><desc id="desc">project.pbxproj では 1 本の追加で PBXFileReference、PBXBuildFile、グループの children、ビルドフェーズの files の 4 か所が変わる。同期フォルダではフォルダに置くだけで、プロジェクトファイルは変わらない。</desc><rect width="880" height="470" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32" y="48" font-size="24" font-weight="650">ファイルを 1 本足すと、プロジェクトファイルのどこが変わるか</text><rect x="32" y="74" width="396" height="364" rx="14" fill="white" stroke="#cbdbe2"/><text x="230" y="106" font-size="18" text-anchor="middle" font-weight="600">ファイル単位で登録 (従来の pbxproj)</text><rect x="110" y="122" width="240" height="40" rx="9" fill="#f7e7cf" stroke="#9a5b00"/><text x="230.0" y="148.3" font-size="18" text-anchor="middle" fill="#9a5b00" font-weight="600">+ Note.swift を足す</text><rect x="80" y="196" width="300" height="36" rx="9" fill="white" stroke="#cbdbe2"/><text x="230.0" y="219.9" font-size="17" text-anchor="middle" fill="#243b49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PBXFileReference</text><rect x="80" y="242" width="300" height="36" rx="9" fill="white" stroke="#cbdbe2"/><text x="230.0" y="265.9" font-size="17" text-anchor="middle" fill="#243b49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PBXBuildFile</text><rect x="80" y="288" width="300" height="36" rx="9" fill="white" stroke="#cbdbe2"/><text x="230.0" y="311.9" font-size="17" text-anchor="middle" fill="#243b49">グループの children</text><rect x="80" y="334" width="300" height="36" rx="9" fill="white" stroke="#cbdbe2"/><text x="230.0" y="357.9" font-size="17" text-anchor="middle" fill="#243b49">ビルドフェーズの files</text><path d="M230 162 L230 192" stroke="#577381" stroke-width="2" fill="none"/><path d="M224 185 L230 192 L236 185" stroke="#577381" stroke-width="2" fill="none"/><text x="230" y="396" font-size="17" text-anchor="middle" fill="#9a5b00" font-weight="600">4 か所が書き換わる。</text><text x="230" y="420" font-size="16" text-anchor="middle" fill="#577381">行どうしはランダムな ID で結ばれる</text><rect x="452" y="74" width="396" height="364" rx="14" fill="white" stroke="#cbdbe2"/><text x="650" y="106" font-size="18" text-anchor="middle" font-weight="600">同期フォルダ (pbxproj でも xcproj でも)</text><rect x="530" y="122" width="240" height="40" rx="9" fill="#f7e7cf" stroke="#9a5b00"/><text x="650.0" y="148.3" font-size="18" text-anchor="middle" fill="#9a5b00" font-weight="600">+ Note.swift を足す</text><path d="M650 162 L650 192" stroke="#577381" stroke-width="2" fill="none"/><path d="M644 185 L650 192 L656 185" stroke="#577381" stroke-width="2" fill="none"/><rect x="510" y="196" width="280" height="40" rx="9" fill="white" stroke="#cbdbe2"/><text x="650.0" y="221.9" font-size="17" text-anchor="middle" fill="#243b49">Sources/ フォルダに置く</text><rect x="510" y="272" width="280" height="44" rx="9" fill="#dff0ee" stroke="#087e8b"/><text x="650.0" y="299.9" font-size="17" text-anchor="middle" fill="#087e8b" font-weight="600">プロジェクトファイル: 変更なし</text><text x="650" y="396" font-size="17" text-anchor="middle" fill="#087e8b" font-weight="600">ファイルの追加・削除・改名では</text><text x="650" y="420" font-size="16" text-anchor="middle" fill="#577381">プロジェクトファイルに触れない</text></g></svg>