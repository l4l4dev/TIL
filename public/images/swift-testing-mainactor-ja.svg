<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" role="img" aria-labelledby="title desc"><title id="title">main を使うテストが増えると、値が届くのが遅れる</title><desc id="desc">300ms 後に送られる値を AsyncStream で待ったときの遅れ。待つ側だけ main にいると、同時に走る @MainActor の重いテストが 0、2、4、8 個のとき、遅れはほぼ 0、100ms、200ms、400ms だった。送る側も main にいると、ほぼ 0、200〜300ms、500〜600ms で、8 個では 5 回中 2 回が自前の 1 秒のタイムアウトで切れた。重いテストはそれぞれ main を 50ms 使ってから順番を譲る。重いテストが 8 個のときの遅れ 400ms は、待つ側が 8 個の後ろに並んだときの 8 × 50ms と同じだった。main 以外で待つと、8 個でも遅れは 20ms 以下だった。</desc><rect width="880" height="700" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32.0" y="46.0" font-size="24" fill="#243b49" text-anchor="start" font-weight="650">main を使うテストが増えると、値が届くのが遅れる</text><text x="32.0" y="76.0" font-size="16" fill="#577381" text-anchor="start">300ms 後に送られる値を AsyncStream で待ち、何 ms 遅れて届いたか (3 回流した代表値)</text><rect x="32" y="96" width="816" height="400" rx="12" fill="white" stroke="#cbdbe2"/><text x="52.0" y="126.0" font-size="18" fill="#243b49" text-anchor="start" font-weight="600">同時に走る @MainActor の重いテストの数と、遅れ</text><rect x="52.0" y="140.0" width="20.0" height="16" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="80.0" y="153.0" font-size="14" fill="#577381" text-anchor="start">待つ側だけ main</text><rect x="340.0" y="140.0" width="20.0" height="16" rx="6" fill="#087e8b" stroke="#087e8b"/><text x="368.0" y="153.0" font-size="14" fill="#577381" text-anchor="start">待つ側も送る側も main</text><text x="234.0" y="212.0" font-size="15" fill="#243b49" text-anchor="end">重いテスト 0 個</text><rect x="250.0" y="178.0" width="3.0" height="22" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="263.0" y="195.0" font-size="13" fill="#577381" text-anchor="start">ほぼ 0</text><rect x="250.0" y="206.0" width="3.0" height="22" rx="6" fill="#087e8b" stroke="#087e8b"/><text x="263.0" y="223.0" font-size="13" fill="#577381" text-anchor="start">ほぼ 0</text><text x="234.0" y="282.0" font-size="15" fill="#243b49" text-anchor="end">重いテスト 2 個</text><rect x="250.0" y="248.0" width="54.0" height="22" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="314.0" y="265.0" font-size="13" fill="#577381" text-anchor="start">100ms</text><rect x="250.0" y="276.0" width="162.0" height="22" rx="6" fill="#087e8b" stroke="#087e8b"/><text x="422.0" y="293.0" font-size="13" fill="#577381" text-anchor="start">200〜300ms</text><text x="234.0" y="352.0" font-size="15" fill="#243b49" text-anchor="end">重いテスト 4 個</text><rect x="250.0" y="318.0" width="108.0" height="22" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="368.0" y="335.0" font-size="13" fill="#577381" text-anchor="start">200ms</text><rect x="250.0" y="346.0" width="324.0" height="22" rx="6" fill="#087e8b" stroke="#087e8b"/><text x="584.0" y="363.0" font-size="13" fill="#577381" text-anchor="start">500〜600ms</text><text x="234.0" y="422.0" font-size="15" fill="#243b49" text-anchor="end">重いテスト 8 個</text><rect x="250.0" y="388.0" width="216.0" height="22" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="476.0" y="405.0" font-size="13" fill="#577381" text-anchor="start">400ms</text><rect x="250.0" y="416" width="540.0" height="22" rx="6" fill="white" stroke="#087e8b" stroke-dasharray="5 4"/><text x="260.0" y="433.0" font-size="13" fill="#087e8b" text-anchor="start" font-weight="600">5 回中 2 回、1 秒で時間切れ</text><line x1="250.0" y1="170" x2="250.0" y2="458" stroke="#cbdbe2" stroke-width="1.5"/><text x="250.0" y="476.0" font-size="13" fill="#577381" text-anchor="middle">0ms</text><line x1="385.0" y1="170" x2="385.0" y2="458" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="385.0" y="476.0" font-size="13" fill="#577381" text-anchor="middle">250ms</text><line x1="520.0" y1="170" x2="520.0" y2="458" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="520.0" y="476.0" font-size="13" fill="#577381" text-anchor="middle">500ms</text><line x1="655.0" y1="170" x2="655.0" y2="458" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="655.0" y="476.0" font-size="13" fill="#577381" text-anchor="middle">750ms</text><line x1="790.0" y1="170" x2="790.0" y2="458" stroke="#087e8b" stroke-width="1.5"/><text x="790.0" y="476.0" font-size="13" fill="#577381" text-anchor="middle">1000ms</text><text x="784.0" y="166.0" font-size="13" fill="#087e8b" text-anchor="end">自前のタイムアウト 1 秒</text><rect x="32" y="516" width="816" height="160" rx="12" fill="white" stroke="#cbdbe2"/><text x="52.0" y="546.0" font-size="18" fill="#243b49" text-anchor="start" font-weight="600">遅れの数え方 (重いテスト 8 個のとき)</text><text x="116.0" y="590.0" font-size="15" fill="#243b49" text-anchor="end" font-weight="600">main</text><rect x="131.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="165.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">重い1</text><rect x="201.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="235.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">重い2</text><rect x="271.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="305.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">重い3</text><rect x="341.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="375.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">重い4</text><rect x="411.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="445.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">重い5</text><rect x="481.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="515.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">重い6</text><rect x="551.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="585.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">重い7</text><rect x="621.0" y="570.0" width="68.0" height="30" rx="6" fill="#dff0ee" stroke="#cbdbe2"/><text x="655.0" y="590.0" font-size="12" fill="#577381" text-anchor="middle">重い8</text><rect x="691.0" y="570.0" width="69.0" height="30" rx="6" fill="#087e8b" stroke="#087e8b"/><text x="725.0" y="590.0" font-size="12" fill="white" text-anchor="middle" font-weight="600">待つ側</text><text x="130.0" y="628.0" font-size="14" fill="#577381" text-anchor="start">重いテストはそれぞれ main を 50ms 使ってから順番を譲る。遅れの 400ms は、待つ側が</text><text x="130.0" y="652.0" font-size="14" fill="#577381" text-anchor="start">8 個の後ろに並んだときの 8 × 50ms と同じだった。main 以外で待つと 20ms 以下だった。</text></g></svg>
