<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">Who did what before the App Store release</title><rect width="760" height="420" rx="20" fill="#f0f5f7"/><g font-family="sans-serif" fill="#243b49"><text x="36" y="48" font-size="22" font-weight="600">Who did what before the App Store release</text><rect x="36" y="72" width="336" height="282" rx="12" fill="#dff0ee" stroke="#cbdbe2"/><text x="56" y="106" font-size="19" font-weight="600" fill="#087e8b">Claude Code</text><circle cx="62" cy="140" r="4" fill="#577381"/><text x="76" y="146" font-size="16">App Store Connect fields</text><circle cx="62" cy="184" r="4" fill="#577381"/><text x="76" y="190" font-size="16">Screenshots: capture and upload</text><circle cx="62" cy="228" r="4" fill="#577381"/><text x="76" y="234" font-size="16">Build archive and upload</text><circle cx="62" cy="272" r="4" fill="#577381"/><text x="76" y="278" font-size="16">Review notes and build choice</text><circle cx="62" cy="316" r="4" fill="#577381"/><text x="76" y="322" font-size="16">App Privacy answers (draft)</text><rect x="388" y="72" width="336" height="282" rx="12" fill="white" stroke="#cbdbe2"/><text x="408" y="106" font-size="19" font-weight="600" fill="#243b49">Human</text><circle cx="414" cy="140" r="4" fill="#577381"/><text x="428" y="146" font-size="16">Signing in</text><circle cx="414" cy="184" r="4" fill="#577381"/><text x="428" y="190" font-size="16">Accepting terms</text><circle cx="414" cy="228" r="4" fill="#577381"/><text x="428" y="234" font-size="16">Contact info and DSA status</text><circle cx="414" cy="272" r="4" fill="#577381"/><text x="428" y="278" font-size="16">The Submit for Review button</text><circle cx="414" cy="316" r="4" fill="#577381"/><text x="428" y="322" font-size="16">Device checks in TestFlight</text><text x="36" y="388" font-size="14" fill="#577381">Decisions (copy, price, regions, privacy answers) are made by the human; Claude Code enters them</text></g></svg>