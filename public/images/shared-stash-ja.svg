<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 578" role="img" aria-labelledby="title desc"><title id="title">worktree は別々、stash は共有</title><desc id="desc">A → B の順に退避すると、A の pop は B の変更を取り出す</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#577381"/></marker></defs><rect width="880" height="578" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="36" y="48" font-size="25" font-weight="650">worktree は別々、stash は共有</text><text x="36" y="80" font-size="16" fill="#577381">A → B の順に退避すると、A の pop は B の変更を取り出す</text><rect x="48" y="116" width="350" height="84" rx="12" fill="white" stroke="#cbdbe2"/><text x="223.0" y="151.0" text-anchor="middle" font-size="19" fill="#243b49">worktree A</text><text x="223.0" y="179.0" text-anchor="middle" font-size="19" fill="#243b49">a.txt を変更 → stash push</text><rect x="482" y="116" width="350" height="84" rx="12" fill="white" stroke="#cbdbe2"/><text x="657.0" y="151.0" text-anchor="middle" font-size="19" fill="#243b49">worktree B</text><text x="657.0" y="179.0" text-anchor="middle" font-size="19" fill="#243b49">b.txt を変更 → stash push</text><path d="M223 200 V228 H310 V254" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M657 200 V228 H570 V254" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="223" y="227" text-anchor="middle" font-size="16" fill="#243b49">① push A</text><text x="657" y="227" text-anchor="middle" font-size="16" fill="#243b49">② push B</text><rect x="210" y="254" width="460" height="138" rx="12" fill="#dff0ee" stroke="#087e8b"/><text x="440.0" y="302.0" text-anchor="middle" font-size="19" fill="#243b49">共有の refs/stash</text><text x="440.0" y="330.0" text-anchor="middle" font-size="19" fill="#243b49">stash@{0}: B → b.txt</text><text x="440.0" y="358.0" text-anchor="middle" font-size="19" fill="#243b49">stash@{1}: A → a.txt</text><path d="M440 392 V432" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="150" y="432" width="580" height="76" rx="12" fill="white" stroke="#cbdbe2"/><text x="440.0" y="477.0" text-anchor="middle" font-size="19" fill="#243b49">③ A で stash pop → B の変更が A に入る</text><text x="440" y="548" text-anchor="middle" font-size="17" fill="#243b49">pop は作成元の worktree ではなく、先頭の退避を使う</text></g></svg>
