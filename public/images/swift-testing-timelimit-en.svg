<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="title desc"><title id="title">Past .timeLimit, only a test that responds to cancellation stops</title><desc id="desc">Both tests have a 1 minute limit and wait 90 seconds. The test that waits with Task.sleep throws CancellationError and fails at about 64 seconds. The test that waits with Thread.sleep has the time limit recorded at about the same time as the others, about 64 seconds, but keeps running and fails at 90 seconds. Both messages read Time limit was exceeded: 60.000 seconds.</desc><rect width="880" height="400" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32.0" y="46.0" font-size="24" fill="#243b49" text-anchor="start" font-weight="650">Past .timeLimit, only a test that responds to cancellation stops</text><text x="32.0" y="76.0" font-size="16" fill="#577381" text-anchor="start">Both tests have .timeLimit(.minutes(1)) and wait 90 seconds</text><rect x="32" y="100" width="816" height="230" rx="12" fill="white" stroke="#cbdbe2"/><line x1="600.0" y1="116" x2="600.0" y2="314" stroke="#087e8b" stroke-width="1.5" stroke-dasharray="5 5"/><text x="594.0" y="132.0" font-size="14" fill="#087e8b" text-anchor="end">1 minute limit</text><text x="184.0" y="181.0" font-size="15" fill="#243b49" text-anchor="end">Task.sleep(90)</text><rect x="200.0" y="160.0" width="426.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="626.7" y="182.0" font-size="20" fill="#b3412e" text-anchor="middle">✕</text><text x="210.0" y="212.0" font-size="14" fill="#577381" text-anchor="start">Throws CancellationError, fails at about 64 s</text><text x="184.0" y="261.0" font-size="15" fill="#243b49" text-anchor="end">Thread.sleep(90)</text><rect x="200.0" y="240.0" width="600.0" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="800.0" y="262.0" font-size="20" fill="#b3412e" text-anchor="middle">✕</text><text x="210.0" y="292.0" font-size="14" fill="#577381" text-anchor="start">Time limit recorded at about 64 s, but keeps running and fails at 90 s</text><circle cx="626.7" cy="255" r="6" fill="#087e8b"/><text x="200.0" y="356.0" font-size="14" fill="#577381" text-anchor="middle">0s</text><text x="400.0" y="356.0" font-size="14" fill="#577381" text-anchor="middle">30s</text><text x="600.0" y="356.0" font-size="14" fill="#577381" text-anchor="middle">60s</text><text x="800.0" y="356.0" font-size="14" fill="#577381" text-anchor="middle">90s</text><text x="32.0" y="386.0" font-size="14" fill="#577381" text-anchor="start">Both messages read: Time limit was exceeded: 60.000 seconds</text></g></svg>
