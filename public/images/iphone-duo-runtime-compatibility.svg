<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">iPhone Duo simulator runtime compatibility</title>
<desc id="desc">The regular iOS 27.2 runtime cannot create an iPhone Duo simulator. The Duo-specific runtime ending in iPhone19-4 can create it.</desc>
<rect width="960" height="380" rx="22" fill="#f7f8fa"/>
<text x="480" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#1d2430">iPhone Duo simulator</text>
<rect x="32" y="88" width="432" height="250" rx="18" fill="#fff" stroke="#e5b9bd" stroke-width="2"/>
<rect x="496" y="88" width="432" height="250" rx="18" fill="#fff" stroke="#a7d4b5" stroke-width="2"/>
<circle cx="78" cy="138" r="22" fill="#b42332"/><path d="M69 129l18 18m0-18l-18 18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<circle cx="542" cy="138" r="22" fill="#177d4a"/><path d="M532 138l7 7 14-15" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="system-ui, sans-serif" fill="#1d2430">
<text x="112" y="133" font-size="22" font-weight="700">Regular iOS 27.2</text>
<text x="576" y="133" font-size="22" font-weight="700">Duo-only iOS 27.2</text>
<text x="112" y="159" font-size="16" fill="#555f6d">Incompatible device</text>
<text x="576" y="159" font-size="16" fill="#35654b">Simulator created</text>
</g>
<rect x="54" y="190" width="388" height="78" rx="10" fill="#f4f5f7"/>
<rect x="518" y="190" width="388" height="78" rx="10" fill="#f4f5f7"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#263247">
<text x="74" y="221">iOS-27-2</text>
<text x="538" y="221">iOS-27-2-iPhone19-4</text>
</g>
<g font-family="system-ui, sans-serif" font-size="15" fill="#536171">
<text x="74" y="249">Standard runtime identifier</text>
<text x="538" y="249">Device-specific runtime identifier</text>
</g>
<g font-family="system-ui, sans-serif" font-size="16" font-weight="600">
<text x="248" y="307" text-anchor="middle" fill="#a52a37">Not supported</text>
<text x="712" y="307" text-anchor="middle" fill="#177d4a">Supported</text>
</g>
<text x="480" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#526070">Runtime identifiers are abbreviated; see the commands in the article.</text>
</svg>