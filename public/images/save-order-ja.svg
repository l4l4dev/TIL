<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" role="img" aria-labelledby="title desc"><title id="title">古い自動保存が、新しい保存のあとに届く</title><desc id="desc">自動保存Bが待つ間に終了時の保存Aが先に書かれる。通し番号なしでは古いBが後から上書きし、通し番号ありでは古い要求を見送ってAを保つ。</desc><rect width="880" height="650" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32" y="46" font-size="25" font-weight="650">古い自動保存が、新しい保存のあとに届く</text><text x="32" y="78" font-size="17" fill="#577381">ディスクも画面も A。編集中の B は、まだ書かれていない。</text><rect x="48" y="110" width="784" height="60" rx="10" fill="white" stroke="#cbdbe2"/><text x="72" y="147" font-size="20">① 自動保存が B を切り出し、書く順番を待つ</text><path d="M440 170 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#577381" stroke-width="2"/><rect x="48" y="196" width="784" height="60" rx="10" fill="white" stroke="#cbdbe2"/><text x="72" y="233" font-size="20">② ユーザーが A に戻す → 終了時の保存が A を書く</text><path d="M440 256 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#577381" stroke-width="2"/><rect x="48" y="282" width="784" height="60" rx="10" fill="white" stroke="#cbdbe2"/><text x="72" y="319" font-size="20">③ 待っていた古い B が、書き込みの直前まで進む</text><rect x="48" y="384" width="380" height="190" rx="12" fill="white" stroke="#cbdbe2"/><text x="238" y="419" text-anchor="middle" font-size="21" font-weight="650">通し番号なし</text><text x="238" y="459" text-anchor="middle" font-size="18" >ディスクは A → 比較を通過</text><text x="238" y="499" text-anchor="middle" font-size="18" >古い B を書く</text><text x="238" y="539" text-anchor="middle" font-size="18" font-weight="650">画面 A ／ ディスク B</text><rect x="452" y="384" width="380" height="190" rx="12" fill="#dff0ee" stroke="#087e8b"/><text x="642" y="419" text-anchor="middle" font-size="21" font-weight="650">通し番号あり</text><text x="642" y="459" text-anchor="middle" font-size="18" >古い要求 #1 ＜ 先に入った #2</text><text x="642" y="499" text-anchor="middle" font-size="18" >B は書かない（superseded）</text><text x="642" y="539" text-anchor="middle" font-size="18" font-weight="650">画面 A ／ ディスク A</text><path d="M440 342 V364 H238 V380 M440 364 H642 V380" stroke="#577381" stroke-width="2" fill="none"/><text x="440" y="616" text-anchor="middle" font-size="17" fill="#577381">同じプロセス内の順序を守る仕組み。外のエディタとの競合は別に扱う。</text></g></svg>
