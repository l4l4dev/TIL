<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">A first team conversation</title><rect width="760" height="370" rx="20" fill="#eef4f7"/><g font-family="sans-serif" fill="#253747"><text x="36" y="48" font-size="22" font-weight="600">A first team conversation</text><rect x="36" y="78" width="320" height="106" rx="12" fill="white" stroke="#cfdae0"/><circle cx="66" cy="111" r="17" fill="#426d81"/><text x="66" y="117" text-anchor="middle" fill="white" font-size="17">1</text><text x="94" y="118" font-size="19" font-weight="600">Write separately</text><text x="61" y="155" font-size="16" fill="#5b6c77">Purpose and expectations</text><rect x="386" y="78" width="320" height="106" rx="12" fill="white" stroke="#cfdae0"/><circle cx="416" cy="111" r="17" fill="#426d81"/><text x="416" y="117" text-anchor="middle" fill="white" font-size="17">2</text><text x="444" y="118" font-size="19" font-weight="600">Discuss differences</text><text x="411" y="155" font-size="16" fill="#5b6c77">Ask for reasons</text><rect x="36" y="212" width="320" height="106" rx="12" fill="white" stroke="#cfdae0"/><circle cx="66" cy="245" r="17" fill="#426d81"/><text x="66" y="251" text-anchor="middle" fill="white" font-size="17">3</text><text x="94" y="252" font-size="19" font-weight="600">Record the outcome</text><text x="61" y="289" font-size="16" fill="#5b6c77">Decided or still open</text><rect x="386" y="212" width="320" height="106" rx="12" fill="white" stroke="#cfdae0"/><circle cx="416" cy="245" r="17" fill="#426d81"/><text x="416" y="251" text-anchor="middle" fill="white" font-size="17">4</text><text x="444" y="252" font-size="19" font-weight="600">Plan the follow-up</text><text x="411" y="289" font-size="16" fill="#5b6c77">Who and when</text></g></svg>