<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="title desc"><title id="title">.timeLimit を超えると、キャンセルに応えるテストだけが止まる</title><desc id="desc">どちらのテストにも 1 分の制限を付け、90 秒待たせた。Task.sleep で待つテストは CancellationError を投げ、約 64 秒で失敗した。Thread.sleep で待つテストは、ほかのテストと同じころ (約 64 秒) に時間切れが記録されたが、90 秒まで動き続けてから失敗した。メッセージはどちらも Time limit was exceeded: 60.000 seconds。</desc><rect width="880" height="400" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32.0" y="46.0" font-size="24" fill="#243b49" text-anchor="start" font-weight="650">.timeLimit を超えると、キャンセルに応えるテストだけが止まる</text><text x="32.0" y="76.0" font-size="16" fill="#577381" text-anchor="start">どちらも .timeLimit(.minutes(1)) を付け、90 秒待つテスト</text><rect x="32" y="100" width="816" height="230" rx="12" fill="white" stroke="#cbdbe2"/><line x1="600.0" y1="116" x2="600.0" y2="314" stroke="#087e8b" stroke-width="1.5" stroke-dasharray="5 5"/><text x="594.0" y="132.0" font-size="14" fill="#087e8b" text-anchor="end">制限 1 分</text><text x="184.0" y="181.0" font-size="15" fill="#243b49" text-anchor="end">Task.sleep(90)</text><rect x="200.0" y="160.0" width="426.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="626.7" y="182.0" font-size="20" fill="#b3412e" text-anchor="middle">✕</text><text x="210.0" y="212.0" font-size="14" fill="#577381" text-anchor="start">CancellationError を投げ、約 64 秒で失敗</text><text x="184.0" y="261.0" font-size="15" fill="#243b49" text-anchor="end">Thread.sleep(90)</text><rect x="200.0" y="240.0" width="600.0" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="800.0" y="262.0" font-size="20" fill="#b3412e" text-anchor="middle">✕</text><text x="210.0" y="292.0" font-size="14" fill="#577381" text-anchor="start">約 64 秒で時間切れを記録したが、90 秒まで動き続けて失敗</text><circle cx="626.7" cy="255" r="6" fill="#087e8b"/><text x="200.0" y="356.0" font-size="14" fill="#577381" text-anchor="middle">0秒</text><text x="400.0" y="356.0" font-size="14" fill="#577381" text-anchor="middle">30秒</text><text x="600.0" y="356.0" font-size="14" fill="#577381" text-anchor="middle">60秒</text><text x="800.0" y="356.0" font-size="14" fill="#577381" text-anchor="middle">90秒</text><text x="32.0" y="386.0" font-size="14" fill="#577381" text-anchor="start">メッセージはどちらも「Time limit was exceeded: 60.000 seconds」</text></g></svg>
