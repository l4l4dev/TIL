<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="title desc"><title id="title">660 件のマージのうち、何がぶつかったか</title><desc id="desc">main から辿れるマージコミット 660 件のうち 126 件でコンフリクト。内訳は作業の記録だけが 94 件、記録とコードの両方が 11 件、記録以外だけが 21 件。Swift がぶつかったマージは 23 件、プロジェクトファイルは 0 件。</desc><rect width="880" height="430" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32" y="48" font-size="24" font-weight="650">660 件のマージのうち、何がぶつかったか</text><text x="48" y="92" font-size="17" fill="#577381">マージ 660 件のうち、コンフリクトがあったのは 126 件 (2026-08-01〜10-06)</text><rect x="48" y="104" width="150" height="40" rx="6" fill="#f7e7cf" stroke="#9a5b00"/><rect x="201" y="104" width="631" height="40" rx="6" fill="white" stroke="#cbdbe2"/><text x="123.0" y="130" font-size="17" fill="#9a5b00" font-weight="600" text-anchor="middle">126</text><text x="214" y="130" font-size="16" fill="#577381">なし 534</text><path d="M48 144 L48 196 M198 144 L832 196" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/><text x="48" y="190" font-size="17" fill="#577381">コンフリクトのあった 126 件の内訳</text><rect x="48" y="202" width="582" height="48" rx="6" fill="#f7e7cf" stroke="#9a5b00"/><text x="60" y="232" font-size="17" fill="#9a5b00" font-weight="600">記録だけ 94</text><rect x="633" y="202" width="65" height="48" rx="6" fill="#efe3f3" stroke="#7a4a8c"/><rect x="701" y="202" width="131" height="48" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="637" y="276" font-size="15" fill="#7a4a8c" font-weight="600">↑ 両方 11</text><text x="832" y="300" font-size="15" fill="#087e8b" font-weight="600" text-anchor="end">記録以外だけ 21 ↑</text><text x="48" y="356" font-size="16" fill="#577381">記録 = タスクの記録と仕様の doc (Backlog.md)</text><text x="48" y="384" font-size="16" fill="#577381">Swift がぶつかったマージ 23 件 / プロジェクトファイル 0 件</text></g></svg>