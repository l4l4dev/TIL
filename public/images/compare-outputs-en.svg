<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 574" role="img" aria-labelledby="title desc"><title id="title">Run both versions on the same inputs</title><desc id="desc">Compare the outputs directly, alongside the existing tests</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#577381"/></marker></defs><rect width="880" height="574" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="36" y="48" font-size="25" font-weight="650">Run both versions on the same inputs</text><text x="36" y="80" font-size="16" fill="#577381">Compare the outputs directly, alongside the existing tests</text><rect x="250" y="112" width="380" height="68" rx="12" fill="white" stroke="#cbdbe2"/><text x="440.0" y="153.0" text-anchor="middle" font-size="19" fill="#243b49">Same inputs, including boundary cases</text><path d="M440 180 V202 H236 V224" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M440 180 V202 H644 V224" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="64" y="224" width="344" height="78" rx="12" fill="white" stroke="#cbdbe2"/><text x="236.0" y="256.0" text-anchor="middle" font-size="19" fill="#243b49">Old version</text><text x="236.0" y="284.0" text-anchor="middle" font-size="19" fill="#243b49">dump-old</text><rect x="472" y="224" width="344" height="78" rx="12" fill="white" stroke="#cbdbe2"/><text x="644.0" y="256.0" text-anchor="middle" font-size="19" fill="#243b49">New version</text><text x="644.0" y="284.0" text-anchor="middle" font-size="19" fill="#243b49">dump-new</text><path d="M236 302 V326" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M644 302 V326" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="64" y="326" width="344" height="66" rx="12" fill="white" stroke="#cbdbe2"/><text x="236.0" y="366.0" text-anchor="middle" font-size="19" fill="#243b49">Every output field → old.txt</text><rect x="472" y="326" width="344" height="66" rx="12" fill="white" stroke="#cbdbe2"/><text x="644.0" y="366.0" text-anchor="middle" font-size="19" fill="#243b49">Every output field → new.txt</text><path d="M236 392 V420 H350 V444" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M644 392 V420 H530 V444" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="250" y="444" width="380" height="64" rx="12" fill="#dff0ee" stroke="#087e8b"/><text x="440.0" y="483.0" text-anchor="middle" font-size="19" fill="#243b49">diff old.txt new.txt</text><text x="440" y="542" text-anchor="middle" font-size="17" fill="#243b49">Differences become visible for the inputs you tested</text></g></svg>
