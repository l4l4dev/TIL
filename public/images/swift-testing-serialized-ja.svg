<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="title desc"><title id="title">何も付けないと同時に、.serialized では 1 つずつ流れる</title><desc id="desc">何も付けないと、テスト a、b、c は 0〜1 秒に同時に流れ、書き終えた値は 1,025、1,056、1,013 で 3,000 に届かない。.serialized を付けると a が 0〜1 秒、b が 1〜2 秒、c が 2〜3 秒に 1 つずつ流れ、値は 1,000、2,000、3,000 になる。スレッドの番号は a が 9987 から 9731、b が 4611 から 10499、c が 3091 から 4867 で、テストごとにも、1 つのテストの中でも変わった。</desc><rect width="880" height="560" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32.0" y="46.0" font-size="24" fill="#243b49" text-anchor="start" font-weight="650">何も付けないと同時に、.serialized では 1 つずつ流れる</text><text x="32.0" y="76.0" font-size="16" fill="#577381" text-anchor="start">3 つのテストが 1 つの数を 1,000 回ずつ増やす。1 回目の実行の記録</text><rect x="32" y="100" width="816" height="170" rx="12" fill="white" stroke="#cbdbe2"/><text x="52.0" y="130.0" font-size="18" fill="#243b49" text-anchor="start" font-weight="600">何も付けない</text><text x="174.0" y="169.0" font-size="16" fill="#243b49" text-anchor="end">a</text><rect x="190.0" y="148.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="358.7" y="169.0" font-size="15" fill="#577381" text-anchor="start">書き終えた値 1,025</text><text x="174.0" y="207.0" font-size="16" fill="#243b49" text-anchor="end">b</text><rect x="190.0" y="186.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="358.7" y="207.0" font-size="15" fill="#577381" text-anchor="start">書き終えた値 1,056</text><text x="174.0" y="245.0" font-size="16" fill="#243b49" text-anchor="end">c</text><rect x="190.0" y="224.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="358.7" y="245.0" font-size="15" fill="#577381" text-anchor="start">書き終えた値 1,013</text><rect x="32" y="290" width="816" height="200" rx="12" fill="white" stroke="#cbdbe2"/><text x="52.0" y="320.0" font-size="18" fill="#243b49" text-anchor="start" font-weight="600">.serialized を付けた Suite</text><text x="174.0" y="359.0" font-size="16" fill="#243b49" text-anchor="end">a</text><rect x="190.0" y="338.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="198.0" y="358.0" font-size="13" fill="#577381" text-anchor="start">9987 → 9731</text><text x="358.7" y="359.0" font-size="15" fill="#577381" text-anchor="start">書き終えた値 1,000</text><text x="174.0" y="397.0" font-size="16" fill="#243b49" text-anchor="end">b</text><rect x="346.7" y="376.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="354.7" y="396.0" font-size="13" fill="#577381" text-anchor="start">4611 → 10499</text><text x="515.3" y="397.0" font-size="15" fill="#577381" text-anchor="start">書き終えた値 2,000</text><text x="174.0" y="435.0" font-size="16" fill="#243b49" text-anchor="end">c</text><rect x="503.3" y="414.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="511.3" y="434.0" font-size="13" fill="#577381" text-anchor="start">3091 → 4867</text><text x="672.0" y="435.0" font-size="15" fill="#577381" text-anchor="start">書き終えた値 3,000</text><text x="52.0" y="474.0" font-size="14" fill="#577381" text-anchor="start">バーの中の数字は、テストの開始と終了のスレッドの番号</text><line x1="190.0" y1="140" x2="190.0" y2="270" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="190.0" y1="330" x2="190.0" y2="456" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="190.0" y1="490" x2="190.0" y2="506" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="190.0" y="524.0" font-size="14" fill="#577381" text-anchor="middle">0秒</text><line x1="346.7" y1="140" x2="346.7" y2="270" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="346.7" y1="330" x2="346.7" y2="456" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="346.7" y1="490" x2="346.7" y2="506" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="346.7" y="524.0" font-size="14" fill="#577381" text-anchor="middle">1秒</text><line x1="503.3" y1="140" x2="503.3" y2="270" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="503.3" y1="330" x2="503.3" y2="456" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="503.3" y1="490" x2="503.3" y2="506" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="503.3" y="524.0" font-size="14" fill="#577381" text-anchor="middle">2秒</text><line x1="660.0" y1="140" x2="660.0" y2="270" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="660.0" y1="330" x2="660.0" y2="456" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="660.0" y1="490" x2="660.0" y2="506" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="660.0" y="524.0" font-size="14" fill="#577381" text-anchor="middle">3秒</text></g></svg>
