<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="title desc"><title id="title">What conflicted in 660 merges</title><desc id="desc">Of 660 merge commits reachable from main, 126 had conflicts: 94 only in work records, 11 in both records and code, and 21 only in non-record files. Swift conflicted in 23 merges, the project file in none.</desc><rect width="880" height="430" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32" y="48" font-size="24" font-weight="650">What conflicted in 660 merges</text><text x="48" y="92" font-size="17" fill="#577381">Of 660 merges, 126 had conflicts (2026-08-01 to 10-06)</text><rect x="48" y="104" width="150" height="40" rx="6" fill="#f7e7cf" stroke="#9a5b00"/><rect x="201" y="104" width="631" height="40" rx="6" fill="white" stroke="#cbdbe2"/><text x="123.0" y="130" font-size="17" fill="#9a5b00" font-weight="600" text-anchor="middle">126</text><text x="214" y="130" font-size="16" fill="#577381">no conflicts 534</text><path d="M48 144 L48 196 M198 144 L832 196" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/><text x="48" y="190" font-size="17" fill="#577381">Breakdown of the 126 merges with conflicts</text><rect x="48" y="202" width="582" height="48" rx="6" fill="#f7e7cf" stroke="#9a5b00"/><text x="60" y="232" font-size="17" fill="#9a5b00" font-weight="600">records only 94</text><rect x="633" y="202" width="65" height="48" rx="6" fill="#efe3f3" stroke="#7a4a8c"/><rect x="701" y="202" width="131" height="48" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="637" y="276" font-size="15" fill="#7a4a8c" font-weight="600">↑ both 11</text><text x="832" y="300" font-size="15" fill="#087e8b" font-weight="600" text-anchor="end">non-record only 21 ↑</text><text x="48" y="356" font-size="16" fill="#577381">records = task notes and spec docs (Backlog.md)</text><text x="48" y="384" font-size="16" fill="#577381">merges with Swift conflicts 23 / with the project file 0</text></g></svg>