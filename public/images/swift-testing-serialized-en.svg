<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="title desc"><title id="title">Without traits tests run together, with .serialized one at a time</title><desc id="desc">Without traits, tests a, b and c all run from 0 to 1 second, and the values they finish with are 1,025, 1,056 and 1,013, short of 3,000. With .serialized, a runs from 0 to 1 second, b from 1 to 2 and c from 2 to 3, and the value goes 1,000, 2,000, 3,000. The threads were 9987 to 9731 for a, 4611 to 10499 for b and 3091 to 4867 for c, so they changed between tests and within a test.</desc><rect width="880" height="560" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="32.0" y="46.0" font-size="24" fill="#243b49" text-anchor="start" font-weight="650">Without traits tests run together, with .serialized one at a time</text><text x="32.0" y="76.0" font-size="16" fill="#577381" text-anchor="start">Three tests each add 1 to one shared number 1,000 times. First run</text><rect x="32" y="100" width="816" height="170" rx="12" fill="white" stroke="#cbdbe2"/><text x="52.0" y="130.0" font-size="18" fill="#243b49" text-anchor="start" font-weight="600">No traits</text><text x="174.0" y="169.0" font-size="16" fill="#243b49" text-anchor="end">a</text><rect x="190.0" y="148.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="358.7" y="169.0" font-size="15" fill="#577381" text-anchor="start">final value 1,025</text><text x="174.0" y="207.0" font-size="16" fill="#243b49" text-anchor="end">b</text><rect x="190.0" y="186.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="358.7" y="207.0" font-size="15" fill="#577381" text-anchor="start">final value 1,056</text><text x="174.0" y="245.0" font-size="16" fill="#243b49" text-anchor="end">c</text><rect x="190.0" y="224.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="358.7" y="245.0" font-size="15" fill="#577381" text-anchor="start">final value 1,013</text><rect x="32" y="290" width="816" height="200" rx="12" fill="white" stroke="#cbdbe2"/><text x="52.0" y="320.0" font-size="18" fill="#243b49" text-anchor="start" font-weight="600">Suite with .serialized</text><text x="174.0" y="359.0" font-size="16" fill="#243b49" text-anchor="end">a</text><rect x="190.0" y="338.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="198.0" y="358.0" font-size="13" fill="#577381" text-anchor="start">9987 → 9731</text><text x="358.7" y="359.0" font-size="15" fill="#577381" text-anchor="start">final value 1,000</text><text x="174.0" y="397.0" font-size="16" fill="#243b49" text-anchor="end">b</text><rect x="346.7" y="376.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="354.7" y="396.0" font-size="13" fill="#577381" text-anchor="start">4611 → 10499</text><text x="515.3" y="397.0" font-size="15" fill="#577381" text-anchor="start">final value 2,000</text><text x="174.0" y="435.0" font-size="16" fill="#243b49" text-anchor="end">c</text><rect x="503.3" y="414.0" width="156.7" height="30" rx="6" fill="#dff0ee" stroke="#087e8b"/><text x="511.3" y="434.0" font-size="13" fill="#577381" text-anchor="start">3091 → 4867</text><text x="672.0" y="435.0" font-size="15" fill="#577381" text-anchor="start">final value 3,000</text><text x="52.0" y="474.0" font-size="14" fill="#577381" text-anchor="start">Numbers inside the bars are the thread at the start and end of each test</text><line x1="190.0" y1="140" x2="190.0" y2="270" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="190.0" y1="330" x2="190.0" y2="456" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="190.0" y1="490" x2="190.0" y2="506" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="190.0" y="524.0" font-size="14" fill="#577381" text-anchor="middle">0s</text><line x1="346.7" y1="140" x2="346.7" y2="270" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="346.7" y1="330" x2="346.7" y2="456" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="346.7" y1="490" x2="346.7" y2="506" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="346.7" y="524.0" font-size="14" fill="#577381" text-anchor="middle">1s</text><line x1="503.3" y1="140" x2="503.3" y2="270" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="503.3" y1="330" x2="503.3" y2="456" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="503.3" y1="490" x2="503.3" y2="506" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="503.3" y="524.0" font-size="14" fill="#577381" text-anchor="middle">2s</text><line x1="660.0" y1="140" x2="660.0" y2="270" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="660.0" y1="330" x2="660.0" y2="456" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="660.0" y1="490" x2="660.0" y2="506" stroke="#cbdbe2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="660.0" y="524.0" font-size="14" fill="#577381" text-anchor="middle">3s</text></g></svg>
