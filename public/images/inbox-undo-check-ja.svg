<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 578" role="img" aria-labelledby="title desc"><title id="title">Inbox の Undo：一致を確かめてから戻す</title><desc id="desc">どの行かを推測せず、ファイル全体の状態を比べる</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#577381"/></marker></defs><rect width="880" height="578" rx="18" fill="#f0f5f7"/><g font-family="system-ui, sans-serif" fill="#243b49"><text x="36" y="48" font-size="25" font-weight="650">Inbox の Undo：一致を確かめてから戻す</text><text x="36" y="80" font-size="16" fill="#577381">どの行かを推測せず、ファイル全体の状態を比べる</text><rect x="250" y="112" width="380" height="70" rx="12" fill="white" stroke="#cbdbe2"/><text x="440.0" y="154.0" text-anchor="middle" font-size="19" fill="#243b49">移動前と移動直後の Inbox を記録</text><path d="M440 182 V216" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="250" y="216" width="380" height="86" rx="12" fill="white" stroke="#cbdbe2"/><text x="440.0" y="252.0" text-anchor="middle" font-size="19" fill="#243b49">現在の Inbox は、移動直後と</text><text x="440.0" y="280.0" text-anchor="middle" font-size="19" fill="#243b49">1 文字も違わない？</text><path d="M350 302 V332 H236 V370" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M530 302 V332 H644 V370" stroke="#577381" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="184" y="354" text-anchor="middle" font-size="18" fill="#087e8b">一致</text><text x="696" y="354" text-anchor="middle" font-size="18" fill="#8c5837">不一致</text><rect x="64" y="370" width="344" height="100" rx="12" fill="#dff0ee" stroke="#087e8b"/><text x="236.0" y="413.0" text-anchor="middle" font-size="19" fill="#243b49">移動前の Inbox に戻す</text><text x="236.0" y="441.0" text-anchor="middle" font-size="19" fill="#243b49">取り消しを続ける</text><rect x="472" y="370" width="344" height="100" rx="12" fill="#fbefdf" stroke="#d4a575"/><text x="644.0" y="413.0" text-anchor="middle" font-size="19" fill="#243b49">何も書き換えず、取り消しを中止</text><text x="644.0" y="441.0" text-anchor="middle" font-size="19" fill="#243b49">理由をユーザーに伝える</text><text x="440" y="516" text-anchor="middle" font-size="17" fill="#243b49">Inbox の判定を、他のファイルへの書き込みより先に行う</text><text x="440" y="548" text-anchor="middle" font-size="16" fill="#243b49">時刻・所要時間の配置は、別の判定で扱う</text></g></svg>
