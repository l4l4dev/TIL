<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title"><title id="title">The workflow used in FirnPlanner</title><rect width="760" height="500" rx="18" fill="#f0f5f7"/><g font-family="sans-serif" fill="#243b49"><text x="32" y="46" font-size="22" font-weight="600">The workflow used in FirnPlanner</text><text x="32" y="104" font-size="19" font-weight="600">Before: regenerate</text><rect x="32" y="128" width="214" height="84" rx="10" fill="white" stroke="#cddce3"/><text x="139" y="178" text-anchor="middle" font-size="17">Edit project.yml</text><path d="M251 170h15m-5-5 5 5-5 5" stroke="#648698" fill="none" stroke-width="2"/><rect x="272" y="128" width="214" height="84" rx="10" fill="white" stroke="#cddce3"/><text x="379" y="178" text-anchor="middle" font-size="17">Run XcodeGen</text><path d="M491 170h15m-5-5 5 5-5 5" stroke="#648698" fill="none" stroke-width="2"/><rect x="512" y="128" width="214" height="84" rx="10" fill="white" stroke="#cddce3"/><text x="619" y="178" text-anchor="middle" font-size="17">Open in Xcode</text><text x="32" y="289" font-size="19" font-weight="600">After: edit directly</text><rect x="32" y="313" width="214" height="84" rx="10" fill="white" stroke="#cddce3"/><text x="139" y="363" text-anchor="middle" font-size="17">Edit project.xcproj</text><path d="M251 355h15m-5-5 5 5-5 5" stroke="#648698" fill="none" stroke-width="2"/><rect x="272" y="313" width="214" height="84" rx="10" fill="white" stroke="#cddce3"/><text x="379" y="363" text-anchor="middle" font-size="17">Check in Xcode</text><path d="M491 355h15m-5-5 5 5-5 5" stroke="#648698" fill="none" stroke-width="2"/><rect x="512" y="313" width="214" height="84" rx="10" fill="white" stroke="#cddce3"/><text x="619" y="363" text-anchor="middle" font-size="17">Commit to Git</text></g></svg>